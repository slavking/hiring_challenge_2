name: Terraform Plan

on:
  pull_request:
    paths:
      - "environments/prod/**"
      - "modules/**"
      - ".github/workflows/terraform-plan.yml"
  push:
    branches: [main]
    paths:
      - "environments/prod/**"
      - "modules/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: environments/prod

jobs:
  plan:
    environment: prod
    name: terraform init & plan (prod)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.11.0"

      # Both the S3 backend and the AWS provider reference the `ecs-prod`
      # CLI profile, so the keys from the `prod` environment secrets are
      # written as that profile instead of exporting AWS_* env vars.
      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials <<'EOF'
          [ecs-prod]
          aws_access_key_id = ${{ secrets.ACCESS_KEY }}
          aws_secret_access_key = ${{ secrets.SECRET_KEY }}
          EOF
          chmod 600 ~/.aws/credentials

      - name: Terraform Init
        run: terraform init -input=false -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -lock=false
